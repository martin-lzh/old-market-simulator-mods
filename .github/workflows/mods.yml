name: Mod CI and releases

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mods-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syntax:
    name: Script, data and workflow syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check Python, PowerShell, JSON and XML syntax
        run: python tools/check_syntax.py
      - name: Test syntax checker
        run: python -m unittest discover -s tools/tests -p test_syntax.py -v
      - name: Check GitHub Actions workflows
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'actionlint.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'actionlint'
          Invoke-WebRequest 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9') {
            throw 'actionlint archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          & (Join-Path $destination 'actionlint.exe') -color -shellcheck= -pyflakes=
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  build:
    name: SDK build and tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate versions and SDK snapshots
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python tools/ci.py validate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            python tools/ci.py validate --base $env:BASE_SHA
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python -m unittest discover -s tools/tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build all seven variants and run logic/localization tests
        run: python tools/ci.py build
      - name: Check release eligibility without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python tools/ci.py check-releases --repository "$env:RELEASE_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-packages
          path: outputs/ci/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish new CHANGELOG versions
    needs: [syntax, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mod-packages
          path: outputs/ci/
      - name: Verify assets and publish (existing releases are skipped)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python tools/ci.py publish --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"
