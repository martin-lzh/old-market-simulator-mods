name: Mod CI and releases

# Pull requests into main are version updates. After the maintainer merges one,
# the release job publishes every new CHANGELOG version and promotes betas
# whose release.json says "prerelease": false (tools/modrelease.py).
#
# Build and test run only when a change touches core files (tools/ci.py NON_CORE
# lists the exceptions), when a Mod would be published or promoted, or on a
# manual run. "CI result" sums up every job as one check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mods-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Changes and release plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      core: ${{ steps.changes.outputs.core }}
      workflows: ${{ steps.changes.outputs.workflows }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Classify changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PYTHONUTF8: '1'
        run: |
          case "$EVENT_NAME" in
            pull_request) python tools/ci.py changes --base "$PR_BASE" --head "$PR_HEAD" --merge-base ;;
            push) python tools/ci.py changes --base "$PUSH_BEFORE" --head "$PUSH_HEAD" ;;
            *) python tools/ci.py changes ;;
          esac
      - name: Release plan (read-only)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PYTHONUTF8: '1'
        run: python tools/ci.py release-plan --repository "$RELEASE_REPOSITORY"

  syntax:
    name: Script, data and workflow syntax
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check Python, PowerShell, JSON and XML syntax
        run: python tools/check_syntax.py
      - name: Test syntax checker
        run: python -m unittest discover -s tools/tests -p test_syntax.py -v
      - name: Check GitHub Actions workflows
        if: needs.changes.outputs.workflows != 'false'
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          destination="$RUNNER_TEMP/actionlint"
          curl -fsSL --retry 3 -o "$archive" 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --strict -
          mkdir -p "$destination"
          tar -xzf "$archive" -C "$destination" actionlint
          "$destination/actionlint" -color -shellcheck= -pyflakes=

  build:
    name: Build and test
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success'
      || needs.changes.outputs.core == 'true' || needs.changes.outputs.release == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Release plan (read-only, when the changes job failed)
        if: needs.changes.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PYTHONUTF8: '1'
        run: python tools/ci.py release-plan --repository "$env:RELEASE_REPOSITORY"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Validate versions and SDK snapshots
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python tools/ci.py validate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            python tools/ci.py validate --base $env:BASE_SHA
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python -m unittest discover -s tools/tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build all eight variants and run logic/localization tests
        run: python tools/ci.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-packages
          path: outputs/ci/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish new versions and promote betas
    needs: [changes, syntax, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mod-packages
          path: outputs/ci/
      - name: Verify packages, publish and promote
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          PYTHONUTF8: '1'
        run: python tools/ci.py publish --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"

  result:
    name: CI result
    needs: [changes, syntax, build, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          SYNTAX: ${{ needs.syntax.result }}
          BUILD: ${{ needs.build.result }}
          RELEASE: ${{ needs.release.result }}
          BUILD_NEEDED: >-
            ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success'
            || needs.changes.outputs.core == 'true' || needs.changes.outputs.release == 'true' }}
          RELEASE_NEEDED: >-
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
            && needs.changes.outputs.release == 'true' }}
        run: |
          failed=0
          check() {
            if [ "$2" = success ] || { [ "$2" = skipped ] && [ "$3" = false ]; }; then
              echo "$1: $2"
            else
              echo "::error title=$1::$1 is $2"
              failed=1
            fi
          }
          check 'Changes and release plan' "$CHANGES" true
          check 'Script, data and workflow syntax' "$SYNTAX" true
          check 'Build and test' "$BUILD" "$BUILD_NEEDED"
          check 'Publish new versions and promote betas' "$RELEASE" "$RELEASE_NEEDED"
          exit "$failed"
